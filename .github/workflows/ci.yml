name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/api}}
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: archmind, POSTGRES_PASSWORD: archmind, POSTGRES_DB: archmind}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U archmind" --health-interval 5s --health-retries 10
    env:
      ARCHMIND_DATABASE_URL: postgresql+psycopg://archmind:archmind@localhost:5432/archmind
      ARCHMIND_TEST_DATABASE_URL: postgresql+psycopg://archmind:archmind@localhost:5432/archmind_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy
      - name: migrations upgrade, downgrade, upgrade
        run: uv run alembic upgrade head && uv run alembic downgrade base && uv run alembic upgrade head
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/web}}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: 20, cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci --no-audit --no-fund
      - run: npm run lint && npm run typecheck
      - run: npm run build

  e2e:
    # Playwright 1.54 has no Chromium build for ubuntu-latest (26.04); pin until we upgrade it.
    runs-on: ubuntu-24.04
    needs: [api, web]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: 20, cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci --no-audit --no-fund
        working-directory: apps/web
      - run: make up
      - run: make smoke
      - name: golden path in a real browser
        run: npx --prefix apps/web playwright install --with-deps chromium && ./scripts/e2e.sh
      - if: failure()
        run: docker compose -f infra/docker-compose.yml logs --tail 200

  secrets:
    runs-on: ubuntu-latest
    permissions: {contents: read, pull-requests: read}  # gitleaks lists PR commits
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
