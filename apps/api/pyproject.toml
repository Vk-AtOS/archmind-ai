[project]
name = "archmind-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "ifcopenshell>=0.9.0.post1",
    "pydantic-settings>=2.16.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# SVG markup lines are long f-strings; splitting them hurts readability.
"archmind/design/drawings.py" = ["E501"]

[tool.mypy]
strict = true
packages = ["archmind"]

[[tool.mypy.overrides]]
# IfcOpenShell ships without full type hints.
module = ["archmind.design.ifc", "tests.*"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
